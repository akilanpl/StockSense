name: Verify StockSense
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: stocksense
          POSTGRES_PASSWORD: stocksense_test
          POSTGRES_DB: stocksense_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stocksense -d stocksense_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://stocksense:stocksense_test@127.0.0.1:5432/stocksense_test_ci
      AUTH_SECRET: ci-only-stocksense-secret-at-least-32-characters
      NEXT_TELEMETRY_DISABLED: '1'
      SMTP_TEST_OUTBOX: /tmp/stocksense-ci-outbox.jsonl
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run verify:auth
      - run: npm run verify:inventory
      - run: npm run verify:integration
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start production app and local test mail relay
        env:
          ALLOW_PUBLIC_SIGNUP: 'true'
          APP_ORIGIN: http://127.0.0.1:3187
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: '3188'
          SMTP_USER: test
          SMTP_PASSWORD: test
          SMTP_FROM: stocksense@example.test
        run: |
          node scripts/test-smtp.mjs > "$RUNNER_TEMP/smtp.log" 2>&1 &
          npm start -- --hostname 127.0.0.1 --port 3187 > "$RUNNER_TEMP/stocksense.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3187/login > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/stocksense.log"
          exit 1
      - run: npm run test:e2e
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: stocksense-verification
          path: |
            test-results/
            ${{ runner.temp }}/stocksense.log
            ${{ runner.temp }}/smtp.log
